<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formularios</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="#" method="post" id="formulario">
        <label for="Nome">Nome:</label>
        <input type="text" required>

        <label for="Email">Email:</label>
        <input type="email" required>

        <label for="Senha">Senha:</label>
        <input type="password"  required>

        <label for="Nasciento">Data de Nascimento:</label>
        <input type="date">

        <label for="Mensagem">Fale sobre você:</label>
        <textarea cols="20" rows="10"></textarea>

        <input type="submit" value="Envial Formulário">
    </form>
</body>
</html>

<!--method="post" enviando alguma coisa para o servidor;
method="get" estou recebendo alguma coisa do servidor;
adicionar o required nos Inputs para que sejam obrigatórios-->
