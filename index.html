<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Form</title>
</head>

<body>
    <section id="formSimples">
        <h1>Formulário 1</h1>
        <form action="" id="form1">

            <div class="nomeForm">
                <label for="nome">Nome:</label>
                <input type="text" placeholder="Nome..." class="nome">
            </div>

            <div class="emailForm">
                <label for="email">Email:</label>
                <input type="email" class="email" required>
            </div>

            <div class="nascForm">
                <label for="nasc">Nascimento:</label>
                <input type="date" class="nasc">
            </div>

            <input type="submit" value="Enviar" class="submit">
        </form>
    </section>

    <br>

    <section id="form2">
        <h1>Formulario 2</h1>
        <form action="">
            
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome">
            </div>

            <div>
                <label for="sobNome">Sobrenome:</label>
                <input type="text" id="sobNome" class="sobNome">
            </div>

            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" class="senha" required>
            </div>

            <div>
                <label for="selecao">Você é estrangeiro?</label>
                <input type="radio" name="estrangeiro" value="sim">
                <label for="sim">Sim</label>
                <input type="radio" name="estrangeiro" value="nao">
                <label for="nao">Não</label>
            </div>

            <div class="block">
                <div>Áreas de interesse</div>
                <input type="checkbox" name="html" value="html">
                <label for="">html</label>
                <input type="checkbox" name="css" value="css">
                <label for="">css</label>
                <input type="checkbox" name="js" value="js">
                <label for="">js</label>
                 
                <label for="estado">Escolha seu estado</label>
                <select name="estado" id="selecao">
                    <option value="">Escolha</option>
                    <option value="">RJ</option>
                    <option value="">RS</option>
                    <option value="">SP</option>
                    <option value="">MG</option>
                    <option value="">PA</option>
                </select>
                <input type="submit" value="Enviar">
            </div>
            </label>
        </form>
    </section>
</body>

</html>


<!--method="post" enviando alguma coisa para o servidor;
method="get" estou recebendo alguma coisa do servidor;
adicionar o required nos Inputs para que sejam obrigatórios;
label é o texto input é o tipo de formulario;
input type:text, é um formulario de texto, onde pode escrever o nome, sobrenome, etc;
input type:email, formulario de email;
input type:date, formulario de data, o vira um formulario de data;
input type:submit, faz com que crie um botão que vai enviar o formulario;
input type:password, ele censura o que a pessoa vai escrever;
input type:radio, cria uma bolinha em que pode ser selecionada;

select name="Nome", faz com que crie uma aba de seleção-->
